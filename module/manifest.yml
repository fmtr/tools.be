name: tools

metadata:
  version: 0.2.4
  org_github: fmtr
  description: Shared Berry utilities for Tasmota.
  link_id: be/tools/tapp

autoexec:
  import: false
  .channels:
    - channel: development
      import: true

patches:
  - .type: Version
    path: tools_version.be
    pattern: "\\bvar\\s+VERSION\\s*=\\s*'{version}'"
